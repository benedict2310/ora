name: Ora
options:
  bundleIdPrefix: com.ora
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: "0.10.0"
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    from: "0.21.0"
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    branch: main
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.1.0"
  kokoro-ios:
    path: Vendor/kokoro-ios
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.8.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    PRODUCT_BUNDLE_IDENTIFIER: com.ora.app
    ENABLE_HARDENED_RUNTIME: NO

targets:
  Ora:
    type: application
    platform: macOS
    sources:
      - path: Ora
        excludes:
          - "**/*.txt"
      - path: Ora/Resources
        type: resource
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Ora/Info.plist
        CODE_SIGN_ENTITLEMENTS: Ora/Ora.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        PRODUCT_NAME: Ora
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXRandom
      - package: mlx-swift
        product: MLXNN
      - package: swift-transformers
        product: Hub
      - package: swift-transformers
        product: Transformers
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXEmbedders
      - package: kokoro-ios
        product: KokoroSwift
        embed: true
      - package: Sparkle
        product: Sparkle

  OraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OraTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ora.app.tests
    dependencies:
      - target: Ora
