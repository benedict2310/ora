# CI — Build + Test on every PR and push to main
#
# Hosted CI remains the default. A same-repository PR may opt into the
# trusted, ephemeral local runner by setting ORA_LOCAL_CI_PR to its exact
# decimal PR number for one run.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCHEME: Ora
  CONFIGURATION: Release
  ARCH: arm64
  DERIVED_DATA: build

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.ORA_LOCAL_CI_PR != '' && format('{0}', github.event.pull_request.number) == vars.ORA_LOCAL_CI_PR && '["self-hosted","macOS","ARM64","ora-local-ci"]' || '"macos-26"') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install XcodeGen
        if: ${{ runner.environment == 'github-hosted' }}
        run: brew install xcodegen

      - name: Verify local XcodeGen and Xcode
        if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen
          xcodegen --version
          developer_dir="$(xcode-select -p)"
          test -n "$developer_dir"
          version="$(DEVELOPER_DIR="$developer_dir" xcodebuild -version | awk '$1 == "Xcode" { print $2 }')"
          /usr/bin/ruby -e 'version = ARGV.fetch(0); abort unless Gem::Version.new(version) >= Gem::Version.new("26.0.1")' "$version"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          echo "Using local Xcode $version via DEVELOPER_DIR (hosted Xcode 26.2 is intentionally non-parity)."

      - name: Select Xcode 26.2
        if: ${{ runner.environment == 'github-hosted' }}
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Copy tracked package resolution
        run: |
          test -f Package.resolved
          mkdir -p Ora.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved Ora.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('Package.resolved', 'project.yml', 'Vendor/kokoro-ios/Package.swift', 'Vendor/MisakiSwift/Package.swift') }}
          restore-keys: |
            spm-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Ora.xcodeproj \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$DERIVED_DATA/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Build
        run: |
          xcodebuild build \
            -project Ora.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -destination "platform=macOS,arch=$ARCH" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_IDENTITY="-" \
            ENABLE_HARDENED_RUNTIME=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Test
        id: test
        continue-on-error: true
        run: ./build.sh test

      - name: Parse test results
        if: always()
        run: python3 scripts/xcresult_summary.py .artifacts/TestResults.xcresult

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: .artifacts/TestResults.xcresult
          retention-days: 7
